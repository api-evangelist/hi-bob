aid: hi-bob
name: Hi Bob
description: >-
  HiBob (bob) is an all-in-one HR platform that connects people management, payroll,
  benefits, and finance for modern, mid-sized and multinational companies. Bob's Public
  API gives developers programmatic access to core HR data and workflows — employee
  profiles and org data, time off and attendance, tasks, documents and eSign, goals,
  job catalog, hiring/ATS, learning, and workforce planning — over a versioned REST
  API at https://api.hibob.com/v1. Authentication is token-based via API "service
  users" (HTTP Basic with a service-user ID and token) with granular category and
  field permissions, plus OAuth 2.0 (authorization code + refresh) for approved
  Marketplace partners scoped to endpoint-level permissions. The API offers cursor-based
  pagination, rate limiting with X-RateLimit-* headers, HMAC-signed Webhooks v2 for
  event notifications, an official hosted Bob MCP Server for AI tools, and a published
  llms.txt index of the developer docs.
